[workspace]
resolver = "2"
members = ["crates/tartarus-core", "crates/tartarus-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Leonardo Nguyen"]
repository = "https://github.com/nguyenttleo/tartarus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

wasmtime = { version = "27", default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = "27"

tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }

redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "streams"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
