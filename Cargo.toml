# Tartarus — Cargo workspace
#
# Two crates:
#   tartarus-core   — the isolation engine (wasmtime/WASI sandbox), run contract, trace, backends
#   tartarus-server — axum gateway + worker + queue/store + CLI
#
# Built and pinned against wasmtime 27.x. If you bump wasmtime, the only file that touches its
# API is crates/tartarus-core/src/sandbox.rs — adjust there.

[workspace]
resolver = "2"
members = ["crates/tartarus-core", "crates/tartarus-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["Leonardo Nguyen"]
repository = "https://github.com/nguyenttleo/tartarus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Sandbox runtime. default-features=false drops wasmtime's vtune/ittapi profiling support — we don't
# profile guests, and it pulls a C library that needs a modern libc to link. We only need the
# compiler (cranelift) and the runtime.
wasmtime = { version = "27", default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = "27"

# Server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Distributed mode only (feature-gated). TLS variants chosen so Upstash (rediss://) and
# Neon (sslmode=require) work out of the box.
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "streams"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
