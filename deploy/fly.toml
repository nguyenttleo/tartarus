app = 'leo-tartarus-api'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  BIND = '0.0.0.0:8080'
  RUNTIMES_DIR = '/app/runtimes'
  WORKER_CONCURRENCY = '2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
