# Full local stack with prod parity: Redis queue + Postgres store + the Tartarus API.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up --build
#
# (For the lightest local loop you don't need this at all — `cargo run -p tartarus-server -- all`
#  runs everything in-memory with zero services.)

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tartarus
      POSTGRES_PASSWORD: tartarus
      POSTGRES_DB: tartarus
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tartarus"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["all"]
    environment:
      BIND: 0.0.0.0:8080
      RUNTIMES_DIR: /app/runtimes
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://tartarus:tartarus@postgres:5432/tartarus
      WORKER_CONCURRENCY: "2"
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
